<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROT-N - stdout || die trying</title>
  <link rel="icon" href="/favicon.ico">
  <meta name="description" content="Show all 26 ROT-N / Caesar shifts of a piece of text.">
  <link rel="canonical" href="https://kegn.info/tools/rot-n.html">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      color: #e4ddd2;
      background: #1a1613;
      max-width: 680px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    header {
      margin-bottom: 3rem;
      border-bottom: 1px solid #2c261e;
      padding-bottom: 1.5rem;
    }

    header h1 { font-size: 1.5rem; color: #f2f1b9; }
    header p  { color: #d16b5e; font-size: 0.9rem; }

    .back {
      display: inline-block;
      margin-bottom: 2rem;
      color: #7cbf9e;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back:hover { color: #a2d9b1; }

    article h1 {
      font-size: 1.6rem;
      color: #d16b5e;
      margin-bottom: 1rem;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      background: #211c17;
      border: 1px solid #2c261e;
      border-radius: 6px;
      padding: 0.75rem;
      color: #e4ddd2;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      margin-bottom: 1.5rem;
    }
    textarea:focus {
      outline: none;
      border-color: #d16b5e;
    }

    .shift-list { list-style: none; }
    .shift-list li {
      display: grid;
      grid-template-columns: 3.5rem 1fr;
      gap: 0.75rem;
      align-items: baseline;
      padding: 0.35rem 0;
      border-bottom: 1px solid #2c261e;
      font-size: 0.85rem;
    }
    .shift-list li:first-child { border-top: 1px solid #2c261e; }

    .shift-tag {
      color: #8a7a63;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .shift-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #e4ddd2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <header>
    <h1>stdout || die trying</h1>
    <p>red teamer</p>
  </header>

  <a class="back" href="../index.html">&larr; back</a>

  <article>
    <h1>ROT-N</h1>

    <textarea id="input" placeholder="Paste text here"></textarea>

    <ul class="shift-list" id="shift-list"></ul>
  </article>

  <script>
    function shiftText(text, n) {
      return text.replace(/[a-zA-Z]/g, (c) => {
        const base = c <= 'Z' ? 65 : 97;
        return String.fromCharCode((((c.charCodeAt(0) - base + n) % 26) + 26) % 26 + base);
      });
    }

    function render() {
      const text = document.getElementById('input').value;
      const list = document.getElementById('shift-list');
      list.innerHTML = '';

      for (let n = 0; n < 26; n++) {
        const li = document.createElement('li');

        const tag = document.createElement('span');
        tag.className = 'shift-tag';
        tag.textContent = 'n=' + n;

        const shifted = document.createElement('span');
        shifted.className = 'shift-text';
        shifted.textContent = shiftText(text, n);

        li.appendChild(tag);
        li.appendChild(shifted);
        list.appendChild(li);
      }
    }

    document.getElementById('input').addEventListener('input', render);
    render();
  </script>
</body>
</html>
