<body>
  <header>
    <h1>stdout || die trying</h1>
    <p>red teamer</p>
  </header>

  <a class="back" href="../index.html">&larr; back</a>

  <article>
    <h1>Subnet Calc</h1>

    <form id="subnet-form">
      <div>
        <label for="target">CIDR</label>
        <input type="text" id="target" placeholder="192.168.1.10/24" autocomplete="off">
      </div>
      <div class="row">
        <button type="submit">Calculate</button>
        <span id="status"></span>
      </div>
    </form>

    <ul class="results" id="output"></ul>
  </article>

  <script>
    function ipToInt(ip) {
      const parts = ip.split('.');
      if (parts.length !== 4) return null;
      const nums = parts.map(Number);
      if (nums.some((n) => !Number.isInteger(n) || n < 0 || n > 255)) return null;
      return ((nums[0] << 24) | (nums[1] << 16) | (nums[2] << 8) | nums[3]) >>> 0;
    }

    function intToIp(n) {
      return [(n >>> 24) & 0xff, (n >>> 16) & 0xff, (n >>> 8) & 0xff, n & 0xff].join('.');
    }

    function parseCidr(input) {
      const match = input.trim().match(/^(.+)\/(\d{1,2})$/);
      if (!match) return null;
      const ip = ipToInt(match[1]);
      const prefix = Number(match[2]);
      if (ip === null || prefix < 0 || prefix > 32) return null;
      return { ip, prefix };
    }

    function calculate(input) {
      const parsed = parseCidr(input);
      if (!parsed) return null;
      const { ip, prefix } = parsed;

      const mask = prefix === 0 ? 0 : (0xFFFFFFFF << (32 - prefix)) >>> 0;
      const wildcard = (~mask) >>> 0;
      const network = (ip & mask) >>> 0;
      const broadcast = (network | wildcard) >>> 0;
      const totalHosts = Math.pow(2, 32 - prefix);

      let first, last, usable;
      if (prefix === 32) {
        first = last = ip;
        usable = 1;
      } else if (prefix === 31) {
        first = network;
        last = broadcast;
        usable = 2;
      } else {
        first = network + 1;
        last = broadcast - 1;
        usable = totalHosts - 2;
      }

      return [
        ['CIDR', intToIp(ip) + '/' + prefix],
        ['Netmask', intToIp(mask)],
        ['Wildcard mask', intToIp(wildcard)],
        ['Network address', intToIp(network)],
        ['Broadcast address', intToIp(broadcast)],
        ['First usable host', intToIp(first >>> 0)],
        ['Last usable host', intToIp(last >>> 0)],
        ['Usable hosts', usable.toLocaleString()],
        ['Total addresses', totalHosts.toLocaleString()],
      ];
    }

    function renderResults(rows) {
      const output = document.getElementById('output');
      output.innerHTML = '';
      for (const [label, value] of rows) {
        const li = document.createElement('li');

        const labelEl = document.createElement('span');
        labelEl.className = 'result-label';
        labelEl.textContent = label;

        const valueEl = document.createElement('span');
        valueEl.className = 'result-value';
        valueEl.textContent = value;

        li.appendChild(labelEl);
        li.appendChild(valueEl);
        output.appendChild(li);
      }
    }

    document.getElementById('subnet-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const target = document.getElementById('target').value;
      const status = document.getElementById('status');
      const rows = calculate(target);

      if (!rows) {
        status.textContent = 'Enter a valid CIDR (e.g. 192.168.1.10/24).';
        status.className = 'error';
        document.getElementById('output').innerHTML = '';
        return;
      }

      status.className = '';
      status.textContent = '';
      renderResults(rows);
    });
  </script>
</body>
