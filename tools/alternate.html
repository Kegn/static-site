<!DOCTYPE html>

  <meta charset="UTF-8">

  <link rel="canonical" href="https://kegn.info/tools/alternate.html">
  <style>

    .variant-url {
      flex: 1;
      word-break: break-all;
      background: #2c261e;
      color: #e4ddd2;
      padding: 0.5rem 0.6rem;
      border-radius: 3px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>stdout || die trying</h1>
    <p>red teamer</p>
  </header>

  <a class="back" href="../index.html">&larr; back</a>

  <article>
    <h1>Alternate IPs</h1>
    <p class="credit">Techniques from <a href="https://web.archive.org/web/20240118013823/http://www.pc-help.org/obscure.htm">"How to Obscure Any URL"</a> (pc-help.org, via Wayback Machine).</p>

    <form id="ip-form">
      <div>
        <label for="target">IP address</label>
        <input type="text" id="target" placeholder="192.168.0.1" autocomplete="off">
      </div>
      <div class="row">
        <button type="submit">Generate</button>
        <span id="status"></span>
      </div>
    </form>

    <ul class="variants" id="output"></ul>
  </article>

  <script>
    function ipToInt(ip) {
      const parts = ip.split('.');
      if (parts.length !== 4) return null;
      const nums = parts.map(Number);
      if (nums.some((n) => !Number.isInteger(n) || n < 0 || n > 255)) return null;
      return ((nums[0] << 24) | (nums[1] << 16) | (nums[2] << 8) | nums[3]) >>> 0;
    }

    function octets(n) {
      return [(n >>> 24) & 0xff, (n >>> 16) & 0xff, (n >>> 8) & 0xff, n & 0xff];
    }

    function toDword(n) {
      return String(n);
    }

    function toOctal(n) {
      return octets(n).map((o) => '0' + o.toString(8)).join('.');
    }

    function toHexDotted(n) {
      return octets(n).map((o) => '0x' + o.toString(16).toUpperCase().padStart(2, '0')).join('.');
    }

    function toHexSingle(n) {
      return '0x' + n.toString(16).toUpperCase().padStart(8, '0');
    }

    function formatOctet(o, fmt) {
      if (fmt === 'hex') return '0x' + o.toString(16).toUpperCase().padStart(2, '0');
      if (fmt === 'oct') return '0' + o.toString(8);
      return String(o);
    }

    const MIXED_PATTERNS = [
      ['hex', 'dec', 'oct', 'hex'],
      ['dec', 'oct', 'hex', 'dec'],
      ['oct', 'hex', 'dec', 'oct'],
      ['hex', 'oct', 'dec', 'hex'],
      ['dec', 'hex', 'oct', 'dec'],
      ['oct', 'dec', 'hex', 'oct'],
    ];

    function toMixed(n, pattern) {
      const os = octets(n);
      return pattern.map((fmt, i) => formatOctet(os[i], fmt)).join('.');
    }

    function buildUrl(host) {
      return 'http://' + host;
    }

    function renderVariants(ip) {
      const n = ipToInt(ip);

      const variants = [
        ['Dotted-decimal', buildUrl(ip)],
        ['Dword', buildUrl(toDword(n))],
        ['Octal', buildUrl(toOctal(n))],
        ['Hex (dotted)', buildUrl(toHexDotted(n))],
        ['Hex (single number)', buildUrl(toHexSingle(n))],
      ];

      for (const pattern of MIXED_PATTERNS) {
        variants.push(['Mixed (' + pattern.join('.') + ')', buildUrl(toMixed(n, pattern))]);
      }

      const output = document.getElementById('output');
      output.innerHTML = '';
      for (const [label, url] of variants) {
        const li = document.createElement('li');

        const labelEl = document.createElement('div');
        labelEl.className = 'variant-label';
        labelEl.textContent = label;

        const row = document.createElement('div');
        row.className = 'variant-row';

        const urlEl = document.createElement('code');
        urlEl.className = 'variant-url';
        urlEl.textContent = url;

        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.className = 'secondary';
        copyBtn.textContent = 'copy';
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(url);
          copyBtn.textContent = 'copied';
          setTimeout(() => { copyBtn.textContent = 'copy'; }, 1200);
        });

        row.appendChild(urlEl);
        row.appendChild(copyBtn);
        li.appendChild(labelEl);
        li.appendChild(row);
        output.appendChild(li);
      }
    }

    document.getElementById('ip-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const target = document.getElementById('target').value.trim();
      const status = document.getElementById('status');

      if (ipToInt(target) === null) {
        status.textContent = 'Enter a valid IP address (e.g. 192.168.0.1).';
        status.className = 'error';
        document.getElementById('output').innerHTML = '';
        return;
      }

      status.className = '';
      status.textContent = '';
      renderVariants(target);
    });
  </script>
</body>
</html>
